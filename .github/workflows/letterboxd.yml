name: Actualizar Letterboxd

on:
  schedule:
    - cron: '17 * * * *'      # cada hora
  workflow_dispatch:           # también a mano, desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer el diario de Letterboxd
        run: python3 letterboxd.py RandomReviewer1 8
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- continuar.json; then
            echo "Sin películas nuevas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Letterboxd: películas recientes" -- continuar.json
          git push
